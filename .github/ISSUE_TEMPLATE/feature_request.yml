name: Feature request
description: Suggest an improvement to ADO PR View.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Do not include tokens or private organization, project, repository, or PR details.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you would like, and any alternatives you considered.
