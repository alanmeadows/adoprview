version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /src/AdoPrView
      - /tests/AdoPrView.Tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
