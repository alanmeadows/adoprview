<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ADO PR View</title>
  <link rel="stylesheet" href="app.css" />
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icon.png" alt="" />
      <div>
        <div class="brand-name">PR View</div>
        <div class="brand-sub" id="who">Azure DevOps</div>
      </div>
    </div>
    <nav class="lanes" id="laneCounters"></nav>
    <div class="tools">
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search title, branch, id, author…  ( / )" autocomplete="off" />
      </div>
      <select id="repoFilter" title="Repository"></select>
      <div class="seg" id="scope">
        <button data-scope="all" class="on">All</button>
        <button data-scope="mine">Mine</button>
        <button data-scope="watched">Watched</button>
      </div>
      <button class="iconbtn" id="refreshBtn" title="Refresh now (R)">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="iconbtn" id="settingsBtn" title="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>
  <div class="statusline" id="statusline"></div>

  <main>
    <div class="table" id="table">
      <div class="thead">
        <div class="c-pr">Pull request</div>
        <div class="c-g" title="Merge status vs target branch">Merge</div>
        <div class="c-g" title="Blocking build policies">Build</div>
        <div class="c-g" title="Status checks, work-item linking and other blocking policies">Checks</div>
        <div class="c-g" title="Unresolved comment threads">Comments</div>
        <div class="c-g" id="botHead" title="Configured review bot on the current iteration">Review bot</div>
        <div class="c-upd">Updated</div>
        <div class="c-act"><span class="action-heading">Actions</span></div>
      </div>
      <div id="rows"></div>
    </div>
    <div class="empty" id="empty" hidden></div>
    <div id="runShelf" aria-label="Copilot runs for PRs outside the current table"></div>
  </main>

  <aside class="drawer" id="drawer" hidden>
    <div class="drawer-head">
      <h2>Settings</h2>
      <button class="iconbtn" id="closeDrawer" title="Close (Esc)"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <div class="toasts" id="toasts"></div>
  <div id="rowMenu" class="row-menu" role="menu" hidden><button type="button" role="menuitem" data-menu-hide>Hide this PR...</button></div>

  <script src="mock.js"></script>
  <script src="app.js"></script>
</body>
</html>
